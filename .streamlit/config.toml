[theme]
base = "dark"
primaryColor = "#8B7CFF"
backgroundColor = "#0B0D12"
secondaryBackgroundColor = "#10141D"
textColor = "#F5F7FA"
font = "sans serif"

[client]
showSidebarNavigation = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
