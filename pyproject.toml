[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-benchmark-lab"
version = "0.1.0"
description = "Experimental platform for Dense Vector RAG, GraphRAG, Hybrid RAG, and routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37,<2",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "plotly>=5.22,<6",
  "requests>=2.32,<3",
  "tenacity>=8.5,<10",
  "qdrant-client>=1.10,<2",
  "neo4j>=5.23,<6",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "networkx>=3.3,<4",
  "pytest>=8.2,<9",
  "google-genai>=0.1.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5,<1",
]
ml = [
  "sentence-transformers>=3.0,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
